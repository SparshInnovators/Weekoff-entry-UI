<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Add Work Calendar - Weekoff Entry</title>
  <!-- Tailwind CDN (quick dev) -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800">

  <main class="min-h-screen p-6 flex flex-col items-center">
    <div class="w-full max-w-5xl bg-white rounded-lg shadow-md border overflow-hidden">
      <!-- Header -->
      <div class="px-6 py-4 border-b">
        <h1 class="text-lg font-semibold">Add Work Calendar</h1>
        <p class="text-sm text-gray-600 mt-1">Select week wise off / half-day options</p>
      </div>

      <!-- Controls -->
      <div class="px-6 py-4 border-b flex flex-col md:flex-row md:items-center md:justify-between space-y-3 md:space-y-0">
        <div class="flex items-center space-x-3">
          <input id="globalHalfday" type="checkbox" class="h-4 w-4 text-blue-600 border-gray-300 rounded" />
          <label for="globalHalfday" class="text-sm font-medium">Half working day (show dropdowns)</label>
        </div>

        <div class="text-sm text-gray-600">
          <span class="font-medium">Tip:</span> Toggle to switch each cell from checkbox to dropdown.
        </div>
      </div>

      <!-- Week grid -->
      <div class="p-4 overflow-x-auto">
        <div class="min-w-full">
          <table class="min-w-full border-collapse">
            <thead>
              <tr class="bg-gray-50">
                <th class="p-3 text-left border text-sm">Day / Week</th>
                <!-- 6 week columns -->
                <th class="p-3 text-center border text-sm">All</th>
                <th class="p-3 text-center border text-sm">1st</th>
                <th class="p-3 text-center border text-sm">2nd</th>
                <th class="p-3 text-center border text-sm">3rd</th>
                <th class="p-3 text-center border text-sm">4th</th>
                <th class="p-3 text-center border text-sm">5th</th>
              </tr>
            </thead>
            <tbody class="bg-white">
              <!-- Loop days -->
              <!-- We'll create rows for Monday ... Sunday -->
              <script>
                // generate table rows via JS for cleaner markup (will run before DOMContentLoaded)
              </script>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Footer with buttons -->
      <div class="px-6 py-4 border-t flex items-center justify-between">
        <div class="text-sm text-gray-600">Calendar your selection</div>
        <div class="flex items-center space-x-3">
          <button id="cancelBtn" type="button" class="px-4 py-2 border rounded text-sm hover:bg-gray-50">Cancel</button>
          <button id="saveBtn" type="button" class="px-4 py-2 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">Save</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Script: build grid, handle toggle and basic save behavior -->
  <script>
    (function () {
      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const weeks = 6;

      // Build table body
      const tbody = document.querySelector('tbody');
      days.forEach((day, rowIndex) => {
        const tr = document.createElement('tr');
        tr.className = rowIndex % 2 === 0 ? 'bg-white' : 'bg-gray-50';

        // Day cell
        const th = document.createElement('th');
        th.scope = 'row';
        th.className = 'p-3 border text-sm font-medium text-left';
        th.textContent = day;
        tr.appendChild(th);

        // Week cells
        for (let w = 1; w <= weeks; w++) {
          const td = document.createElement('td');
          td.className = 'p-3 border text-center';

          // Create a checkbox (default visible)
          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.className = 'cell-checkbox h-4 w-4 text-blue-600';
          cb.setAttribute('aria-label', `${day} week ${w} full day off`);
          cb.dataset.day = day;
          cb.dataset.week = String(w);

          // Create a select (hidden by default)
          const sel = document.createElement('select');
          sel.className = 'cell-select hidden border rounded px-2 py-1 text-sm';
          sel.setAttribute('aria-label', `${day} week ${w} half-day option`);

          const opts = [
            {v: '', t:'--'},
            {v: 'full', t:'Full Day'},
            {v: 'first', t:'First Half'},
            {v: 'second', t:'Second Half'}
          ];
          opts.forEach(o=>{
            const option = document.createElement('option');
            option.value = o.v;
            option.textContent = o.t;
            sel.appendChild(option);
          });

          // Put checkbox and select inside a wrapper for alignment
          const wrapper = document.createElement('div');
          wrapper.className = 'flex items-center justify-center space-x-2';

          wrapper.appendChild(cb);
          wrapper.appendChild(sel);

          td.appendChild(wrapper);
          tr.appendChild(td);
        }

        tbody.appendChild(tr);
      });

      // Elements
      const globalHalfday = document.getElementById('globalHalfday');

      // Toggle handler: when checked, hide checkboxes and show selects; otherwise reverse
      function toggleHalfdayUI(showSelects) {
        document.querySelectorAll('.cell-checkbox').forEach(el => {
          el.style.display = showSelects ? 'none' : '';
        });
        document.querySelectorAll('.cell-select').forEach(el => {
          if (showSelects) {
            el.classList.remove('hidden');
            // set default "Full Day" selected (if you prefer empty, change index)
            el.value = 'full';
          } else {
            el.classList.add('hidden');
            el.value = ''; // reset
          }
        });
      }

      globalHalfday.addEventListener('change', e => {
        toggleHalfdayUI(e.target.checked);
      });

      // Save & Cancel basic handlers
      const saveBtn = document.getElementById('saveBtn');
      const cancelBtn = document.getElementById('cancelBtn');

      saveBtn.addEventListener('click', () => {
        // Gather selections
        const data = [];
        // iterate rows
        document.querySelectorAll('tbody tr').forEach(tr => {
          const day = tr.querySelector('th').textContent.trim();
          const row = { day, weeks: [] };
          // for each week cell (td)
          const tds = Array.from(tr.querySelectorAll('td'));
          tds.forEach((td, idx) => {
            const checkbox = td.querySelector('.cell-checkbox');
            const select = td.querySelector('.cell-select');
            if (globalHalfday.checked) {
              row.weeks.push({ week: idx+1, value: select.value || null });
            } else {
              row.weeks.push({ week: idx+1, value: checkbox.checked ? 'full' : null });
            }
          });
          data.push(row);
        });

        // For demo: show json in new window (or console)
        console.log('Saved data:', data);
        alert('Selections saved (check console).');
      });

      cancelBtn.addEventListener('click', () => {
        // Reset all inputs
        document.querySelectorAll('.cell-checkbox').forEach(cb => cb.checked = false);
        document.querySelectorAll('.cell-select').forEach(sel => sel.value = '');
        // also turn off half-day toggle
        globalHalfday.checked = false;
        toggleHalfdayUI(false);
      });

      // initial state
      toggleHalfdayUI(false);

    })();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Work Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!--Custom Styles for Checkboxes and Dropdowns -->
    <style>
        /*Custom Blue Checkbox*/
        .custom-checkbox {
            appearance: none; -webkit-appearance: none;
            height: 1.1rem; width: 1.1rem;
            background-color: white;
            border: 1px solid #dee2e6; 
            border-radius: 0.25rem;
            cursor: pointer;
            display: grid; place-content: center;
            transition: all 0.2s;
        }
        .custom-checkbox:checked {
            background-color: #0d6efd; 
            border-color: #0d6efd;
        }
        .custom-checkbox:checked::before {
            content: "";
            width: 0.65rem; height: 0.65rem;
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            background-size: contain; background-repeat: no-repeat;
        }

        /*Custom Modern Dropdown (Select)*/
        .custom-select {
            appearance: none; -webkit-appearance: none; 
            background-color: white;
            border: 1px solid #dee2e6;
            border-radius: 0.25rem;
            padding: 0.3rem 2rem 0.3rem 0.5rem; 
            font-size: 0.875rem; 
            width: 100%;
            cursor: pointer;
            /*custom SVG arrow */
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.25em 1.25em;
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4 font-sans">

    <!--Main Card Container-->
    <div id="mainCard" class="bg-gray-50 rounded-lg shadow-lg w-full max-w-5xl overflow-hidden transition-all duration-300">
        <!--Header-->
        <div class="flex justify-between items-center p-5 border-b border-gray-200">
            <h2 class="text-xl font-semibold text-gray-800">Add Work Calendar</h2>
            <button id="toggleBtn" class="text-gray-500 hover:text-gray-800 text-2xl font-bold w-8 h-8 flex items-center justify-center rounded focus:outline-none">
                &times;
            </button>
        </div>
        <!--Collapsible Content Area-->
        <div id="contentArea" class="transition-all duration-300 ease-in-out max-h-[1000px] overflow-hidden">
            <div class="p-6">

                <!--Define Weekend Title-->
                <div class="mb-2">
                    <span class="text-sm font-semibold text-gray-800">Define weekend</span>
                </div>
                
                <!--Toggle Switch-->
                <div class="flex items-center mb-6">
                    <input type="checkbox" id="halfDayModeToggle" class="custom-checkbox">
                    <label for="halfDayModeToggle" class="ml-3 text-sm font-medium text-gray-700 cursor-pointer select-none">
                        Half working day & half weekend
                    </label>
                </div>

                <!--The Calendar Grid Container-->
                <div class="border border-gray-200 rounded-lg overflow-x-auto md:overflow-visible bg-gray-200 relative">
                    <div id="calendarGrid" class="grid gap-y-2 p-2 min-w-[800px] md:min-w-full">
                        <!--Content generated by JS-->
                    </div>
                </div>
            </div>
        </div>

        <!--Footer buttons-->
        <div id="footerArea" class="bg-gray-50 p-5 border-t border-gray-200 flex justify-start gap-3 transition-all duration-300 overflow-hidden max-h-[100px]">
            <button class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow text-sm font-medium transition">
                Save
            </button>
            <button class="bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 px-6 py-2 rounded shadow-sm text-sm font-medium transition">
                Cancel
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Work Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles */
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Main Container -->
    <div class="w-full h-screen flex">
        <div class="bg-white w-full h-full overflow-hidden flex flex-col">
                <!-- Modal Header -->
                <div class="flex items-center justify-between p-6 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-800">Add Work Calendar</h2>
                    <button id="closeModal" class="text-gray-500 hover:text-gray-700 transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>

                <!-- Modal Body -->
                <div class="flex-1 overflow-y-auto p-6">
                    <!-- Define Weekend Section -->
                    <div class="mb-6">
                        <h3 class="text-lg font-medium text-gray-800 mb-4">Define weekend</h3>
                        
                        <!-- Half Working Day Checkbox -->
                        <div class="mb-6">
                            <label class="flex items-center cursor-pointer">
                                <input type="checkbox" id="halfWorkingDay" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500">
                                <span class="ml-2 text-gray-700">Half working day & half weekend</span>
                            </label>
                        </div>

                        <!-- Weekend Selection Grid -->
                        <div class="overflow-x-auto">
                            <table class="w-full border-collapse">
                                <thead>
                                    <tr>
                                        <th class="border border-gray-300 p-2 text-left text-sm font-medium text-gray-700 bg-gray-50 min-w-[100px]"></th>
                                        <th class="border border-gray-300 p-2 text-center text-sm font-medium text-gray-700 bg-gray-50">All</th>
                                        <th class="border border-gray-300 p-2 text-center text-sm font-medium text-gray-700 bg-gray-50">1st</th>
                                        <th class="border border-gray-300 p-2 text-center text-sm font-medium text-gray-700 bg-gray-50">2nd</th>
                                        <th class="border border-gray-300 p-2 text-center text-sm font-medium text-gray-700 bg-gray-50">3rd</th>
                                        <th class="border border-gray-300 p-2 text-center text-sm font-medium text-gray-700 bg-gray-50">4th</th>
                                        <th class="border border-gray-300 p-2 text-center text-sm font-medium text-gray-700 bg-gray-50">5th</th>
                                    </tr>
                                </thead>
                                <tbody id="weekendGrid">
                                    <!-- Rows will be generated by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Calendar Year Definition Section -->
                    <div class="mb-6">
                        <h3 class="text-lg font-medium text-gray-800 mb-4">Calendar year definition</h3>
                        <!-- This section can be expanded as needed -->
                        <div class="text-gray-500 text-sm">
                            <!-- Additional content for calendar year definition -->
                        </div>
                    </div>
                </div>

                <!-- Modal Footer -->
                <div class="flex items-center justify-start gap-3 p-6 border-t border-gray-200">
                    <button id="saveBtn" class="px-6 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition-colors">
                        Save
                    </button>
                    <button id="cancelBtn" class="px-6 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 transition-colors">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Days of the week
        const daysOfWeek = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const columns = ['All', '1st', '2nd', '3rd', '4th', '5th'];

        // Elements
        const closeModalBtn = document.getElementById('closeModal');
        const cancelBtn = document.getElementById('cancelBtn');
        const saveBtn = document.getElementById('saveBtn');
        const halfWorkingDayCheckbox = document.getElementById('halfWorkingDay');
        const weekendGrid = document.getElementById('weekendGrid');

        // Initialize grid
        function initializeGrid() {
            weekendGrid.innerHTML = '';
            
            daysOfWeek.forEach((day, dayIndex) => {
                const row = document.createElement('tr');
                
                // Day label cell
                const dayCell = document.createElement('td');
                dayCell.className = 'border border-gray-300 p-2 text-sm font-medium text-gray-700 bg-gray-50';
                dayCell.textContent = day;
                row.appendChild(dayCell);

                // Create cells for each column
                columns.forEach((col, colIndex) => {
                    const cell = document.createElement('td');
                    cell.className = 'border border-gray-300 p-2 text-center';
                    
                    const cellContent = document.createElement('div');
                    
                    // For "All" column: only checkbox
                    if (colIndex === 0) {
                        cellContent.className = 'flex items-center justify-center';
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.className = 'w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500';
                        checkbox.id = `checkbox-${dayIndex}-${colIndex}`;
                        checkbox.name = `weekend-${day}-${col}`;
                        
                        // Pre-check Saturday checkboxes
                        if (day === 'Saturday') {
                            checkbox.checked = true;
                        }
                        
                        cellContent.appendChild(checkbox);
                    } else {
                        // For "1st"-"5th" columns: checkbox + dropdown (dropdown hidden by default)
                        cellContent.className = 'flex items-center justify-center gap-2';
                        
                        const checkbox = document.createElement('input');
                        checkbox.type = 'checkbox';
                        checkbox.className = 'w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500';
                        checkbox.id = `checkbox-${dayIndex}-${colIndex}`;
                        checkbox.name = `weekend-${day}-${col}`;
                        
                        // Pre-check Saturday checkboxes
                        if (day === 'Saturday') {
                            checkbox.checked = true;
                        }
                        
                        cellContent.appendChild(checkbox);
                        
                        const dropdown = document.createElement('select');
                        dropdown.className = 'w-20 sm:w-24 px-2 py-1 text-xs border border-gray-300 rounded focus:ring-blue-500 focus:border-blue-500 hidden';
                        dropdown.id = `dropdown-${dayIndex}-${colIndex}`;
                        dropdown.name = `dropdown-${day}-${col}`;
                        
                        const options = ['Full Day', '1st Half', '2nd Half'];
                        options.forEach(option => {
                            const optionElement = document.createElement('option');
                            optionElement.value = option.toLowerCase().replace(' ', '-');
                            optionElement.textContent = option;
                            if (option === 'Full Day') {
                                optionElement.selected = true;
                            }
                            dropdown.appendChild(optionElement);
                        });
                        
                        cellContent.appendChild(dropdown);
                    }
                    
                    cell.appendChild(cellContent);
                    row.appendChild(cell);
                });
                
                weekendGrid.appendChild(row);
            });
        }

        // Toggle dropdowns visibility
        function toggleDropdowns() {
            const isChecked = halfWorkingDayCheckbox.checked;
            const dropdowns = document.querySelectorAll('[id^="dropdown-"]');
            
            dropdowns.forEach(dropdown => {
                if (isChecked) {
                    dropdown.classList.remove('hidden');
                } else {
                    dropdown.classList.add('hidden');
                }
            });
        }

        // Save function
        function handleSave() {
            // Collect all form data
            const formData = {
                halfWorkingDay: halfWorkingDayCheckbox.checked,
                weekends: {}
            };

            // Collect checkbox states
            daysOfWeek.forEach((day, dayIndex) => {
                formData.weekends[day] = {};
                columns.forEach((col, colIndex) => {
                    const checkbox = document.getElementById(`checkbox-${dayIndex}-${colIndex}`);
                    if (checkbox) {
                        formData.weekends[day][col] = {
                            checked: checkbox.checked
                        };
                        
                        // If half working day is checked and it's not "All" column, get dropdown value
                        if (halfWorkingDayCheckbox.checked && colIndex > 0) {
                            const dropdown = document.getElementById(`dropdown-${dayIndex}-${colIndex}`);
                            if (dropdown) {
                                formData.weekends[day][col].dropdown = dropdown.value;
                            }
                        }
                    }
                });
            });

            // Save to localStorage
            localStorage.setItem('workCalendarData', JSON.stringify(formData));
            
            // Log the data (you can replace this with actual save logic)
            console.log('Form Data:', formData);
            
            // Show success message (you can replace this with actual save logic)
            alert('Work calendar saved successfully!');
            
            // Optionally, you can send this data to a server:
            // fetch('/api/save-calendar', {
            //     method: 'POST',
            //     headers: { 'Content-Type': 'application/json' },
            //     body: JSON.stringify(formData)
            // });
        }

        // Load saved data from localStorage
        function loadSavedData() {
            const savedData = localStorage.getItem('workCalendarData');
            if (!savedData) return;

            try {
                const formData = JSON.parse(savedData);
                
                // Restore half working day checkbox
                if (formData.halfWorkingDay !== undefined) {
                    halfWorkingDayCheckbox.checked = formData.halfWorkingDay;
                    toggleDropdowns(); // Show/hide dropdowns based on checkbox state
                }

                // Restore checkbox states and dropdown values
                daysOfWeek.forEach((day, dayIndex) => {
                    if (formData.weekends[day]) {
                        columns.forEach((col, colIndex) => {
                            const checkbox = document.getElementById(`checkbox-${dayIndex}-${colIndex}`);
                            if (checkbox && formData.weekends[day][col]) {
                                checkbox.checked = formData.weekends[day][col].checked || false;
                            }

                            // Restore dropdown value if half working day is checked
                            if (formData.halfWorkingDay && colIndex > 0) {
                                const dropdown = document.getElementById(`dropdown-${dayIndex}-${colIndex}`);
                                if (dropdown && formData.weekends[day][col] && formData.weekends[day][col].dropdown) {
                                    dropdown.value = formData.weekends[day][col].dropdown;
                                }
                            }
                        });
                    }
                });
            } catch (error) {
                console.error('Error loading saved data:', error);
            }
        }

        // Event listeners
        halfWorkingDayCheckbox.addEventListener('change', toggleDropdowns);

        saveBtn.addEventListener('click', handleSave);

        closeModalBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to close? Unsaved changes will be lost.')) {
                // You can add close logic here if needed
            }
        });

        cancelBtn.addEventListener('click', () => {
            if (confirm('Are you sure you want to cancel? This will reset the form to default state.')) {
                // Clear saved data and reload
                localStorage.removeItem('workCalendarData');
                window.location.reload();
            }
        });

        // Initialize on page load
        initializeGrid();
        
        // Load saved data after grid is initialized
        setTimeout(() => {
            loadSavedData();
        }, 100);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Add Work Calendar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

<div id="modal" class="bg-white w-full max-w-full sm:max-w-5xl lg:max-w-7xl rounded-lg shadow-lg">

  <!-- Header -->
  <div class="flex justify-between items-center px-6 py-4 border-b">
    <h2 class="text-base sm:text-lg font-semibold">Add Work Calendar</h2>
    <button id="closeBtn" class="text-xl text-gray-500 hover:text-gray-700" aria-label="Close">&times;</button>
  </div>

  <!-- Content -->
  <div class="p-6">

    <!-- Toggle -->
    <label class="flex items-center gap-2 mb-4 text-sm">
      <input type="checkbox" id="halfToggle" checked aria-label="Enable half working day">
      Half working day & half weekend
    </label>

    <!-- Table Wrapper -->
    <div class="bg-gray-50 rounded-lg p-4 overflow-x-auto">

      <!-- Header -->
      <div class="grid grid-cols-1 sm:grid-cols-7 gap-4 text-center font-medium mb-3 w-full">
        <div></div>
        <div>All</div>
        <div>1st</div>
        <div>2nd</div>
        <div>3rd</div>
        <div>4th</div>
        <div>5th</div>
      </div>

      <!-- Body -->
      <div id="calendarBody" class="space-y-3 w-full"></div>
    </div>

    <!-- Footer -->
    <div class="flex justify-end gap-3 mt-6">
      <button onclick="saveCalendar()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700">
        Save
      </button>
      <button id="cancelBtn" class="border px-6 py-2 rounded hover:bg-gray-100" aria-label="Cancel">
        Cancel
      </button>
    </div>

  </div>
</div>

<script src="app.js"></script>
</body>
</html>
